# Local stack that mirrors the Railway layout: backend + frontend + Postgres.
#   cp .env.docker.example .env   (then set a real DJANGO_SECRET_KEY)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karppal
      POSTGRES_USER: karppal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karppal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karppal -d karppal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://karppal:${POSTGRES_PASSWORD:-karppal}@db:5432/karppal
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      # Plain http locally, so no HTTPS redirect / secure-only cookies.
      SECURE_SSL_REDIRECT: "False"
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
  media:
