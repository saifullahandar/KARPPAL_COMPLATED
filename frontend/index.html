<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo_karppal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Karppal Agro-Animal Production &amp; Processing Ltd — agricultural and animal products processing, export, and quality control in Afghanistan." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karppal Agro-Animal Production & Processing Ltd" />
    <meta property="og:description" content="Agricultural and animal products processing, export, and quality control in Afghanistan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" />
    <title>Karppal Agro-Animal Production &amp; Processing Ltd</title>
    <style>
        /* Initial page loader — inline so it paints before the JS/CSS bundle arrives. */
        html { background: #052e16; }
        #app-loader {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
            background:
                radial-gradient(circle at 50% 35%, rgba(74, 222, 128, 0.22), transparent 45%),
                linear-gradient(135deg, #021a0d 0%, #052e16 40%, #14532d 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #app-loader.is-hidden { opacity: 0; visibility: hidden; }
        #app-loader .loader-mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
        #app-loader .loader-ring {
            position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 55%, #4ade80 80%, #bbf7d0 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
                    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            animation: loader-spin 1.1s linear infinite;
        }
        #app-loader .loader-pulse {
            position: absolute; inset: 14px; border-radius: 50%;
            border: 2px solid rgba(74, 222, 128, 0.45);
            animation: loader-pulse 1.8s ease-out infinite;
        }
        #app-loader .loader-pulse.delay { animation-delay: 0.9s; }
        #app-loader .loader-logo {
            position: relative; width: 84px; height: 84px; border-radius: 50%;
            background: #fff; padding: 10px; object-fit: contain;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.45);
            animation: loader-breathe 1.8s ease-in-out infinite;
        }
        #app-loader .loader-title {
            margin: 0; color: #ecfdf5; font-size: 15px; font-weight: 700;
            letter-spacing: 0.32em; text-transform: uppercase; text-align: center;
        }
        #app-loader .loader-bar { width: 180px; height: 3px; border-radius: 999px; overflow: hidden; background: rgba(187, 247, 208, 0.15); }
        #app-loader .loader-bar::after {
            content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
            background: linear-gradient(90deg, transparent, #4ade80, #bbf7d0);
            animation: loader-slide 1.3s ease-in-out infinite;
        }
        @keyframes loader-spin { to { transform: rotate(360deg); } }
        @keyframes loader-pulse { from { transform: scale(0.85); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
        @keyframes loader-breathe { 50% { transform: scale(1.06); } }
        @keyframes loader-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) {
            #app-loader *, #app-loader *::after { animation-duration: 3s !important; }
        }
    </style>
</head>

<body class="container-md bg-zinc-500">
    <div id="app-loader" role="status" aria-label="Loading">
        <div class="loader-mark">
            <span class="loader-pulse"></span>
            <span class="loader-pulse delay"></span>
            <span class="loader-ring"></span>
            <img class="loader-logo" src="./src/assets/logo_karppal.png" alt="Karppal" />
        </div>
        <p class="loader-title">Karppal</p>
        <div class="loader-bar"></div>
    </div>
    <div id="root"></div>
    <script>
        (function () {
            var loader = document.getElementById("app-loader");
            var done = false;
            function hide() {
                if (done) return;
                done = true;
                loader.classList.add("is-hidden");
                setTimeout(function () { loader.remove(); }, 700);
            }
            window.addEventListener("load", function () { setTimeout(hide, 300); });
            // Never keep the site hidden behind the loader if something stalls.
            setTimeout(hide, 8000);
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
